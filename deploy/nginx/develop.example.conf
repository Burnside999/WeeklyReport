# Copy as a NEW site on the TEST server. Replace domain and certificate paths.
server {
    listen 80;
    server_name weekly-test.example.com;
    return 301 https://weekly-test.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name weekly-test.example.com;
    ssl_certificate /etc/nginx/cert/weekly-test.pem;
    ssl_certificate_key /etc/nginx/cert/weekly-test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_cache off;
        proxy_intercept_errors off;
    }
}
