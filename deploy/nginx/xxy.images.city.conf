# WeeklyReport HTTPS reverse proxy.
# Install as /etc/nginx/conf.d/xxy.images.city.conf (inside nginx's http context).
# Certificate locations are absolute paths visible to the Nginx process.
# Set COOKIE_SECURE=true in WeeklyReport's .env and recreate its container.
# Backend must be reachable from Nginx at 172.24.12.188:8080.
# Validate and reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name xxy.images.city;

    return 301 https://xxy.images.city$request_uri;
}

server {
    listen 443 ssl;
    server_name xxy.images.city;

    ssl_certificate     /etc/nginx/cert/xxy.pem;
    ssl_certificate_key /etc/nginx/cert/xxy.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WeeklyReportSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;

    access_log /var/log/nginx/xxy.images.city.access.log;
    error_log  /var/log/nginx/xxy.images.city.error.log warn;

    location / {
        proxy_pass http://172.24.12.188:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        # Metadata lookup may wait for an in-progress scheduled check.
        proxy_read_timeout 300s;

        proxy_cache off;
        proxy_intercept_errors off;
    }
}
