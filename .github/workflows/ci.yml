name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check app/static/app.js && node --check app/static/login.js && node --check app/static/mail.js && node --check app/static/workspace.js && node --check app/static/admin.js
      - name: Mobile mail template browser test (mock SMTP)
        run: |
          npm install --prefix /tmp/weeklyreport-browser playwright@1.51.1
          /tmp/weeklyreport-browser/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_NODE_MODULES=/tmp/weeklyreport-browser/node_modules node tests/browser_mail.cjs
          PLAYWRIGHT_NODE_MODULES=/tmp/weeklyreport-browser/node_modules node tests/browser_accounts.cjs
      - run: docker compose config --quiet
        env:
          ADMIN_PASSWORD: ci-only-password-not-for-production
      - run: docker build -t weeklyreport:test .
      - name: Container smoke test
        run: |
          docker run -d --name weeklyreport-test -p 8080:8080 -e ADMIN_PASSWORD=ci-only-password-not-for-production weeklyreport:test
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs weeklyreport-test
          exit 1

